# Configures ALSA's software mixer (dmix) so the device stays open continuously instead of closing between clips.
# /etc/asound.conf

pcm.speaker {
  type hw
  card 0
}

pcm.dmixer {
  type dmix
  ipc_key 1024
  ipc_perm 0666
  slave {
    pcm "speaker"
    period_time 0
    period_size 1024
    buffer_size 8192
    rate 44100
    channels 2
  }
}

ctl.dmixer {
  type hw
  card 0
}

pcm.!default {
  type plug
  slave.pcm "dmixer"
}